<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Login Staff - FR Cabeleireiros</title>
  <link rel="icon" type="image/png" href="img/fr.ico">

  <!-- CSS -->
  <link rel="stylesheet" href="css/login.css">

  <!-- Nhost -->
  <script type="module" src="js/nhost.js"></script>
</head>

<body>

  <!-- HEADER -->
  <header>
    <a href="login.html">
      <img src="img/fr.png" class="logo" alt="FR Cabeleireiros">
    </a>
  </header>

  <!-- LOGIN CARD -->
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Área do staff</h1>
      <p class="subtitle">Acesso exclusivo a barbeiros</p>

      <input type="text" id="username" placeholder="Username">

      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
        <span id="toggle-password" class="toggle-eye">👁️</span>
      </div>

      <button id="login-btn">Entrar</button>
      <p id="msg"></p>
    </div>
  </div>

  <!-- JS -->
  <script type="module" src="js/login.js"></script>

  <footer class="site-footer">FR Cabeleireiros © 2026</footer>
</body>
</html>
