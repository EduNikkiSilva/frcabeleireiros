<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Painel Staff - FR Cabeleireiros</title>
  <link rel="icon" type="image/png" href="img/fr.ico">

  <!-- FLATPICKR -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/dashboard.css">

  <!-- Nhost -->
  <script type="module" src="js/nhost.js"></script>
</head>

<body>

<header>
  <div class="header-top">
    <div class="logo-area">
      <a href="#" onclick="location.reload(); return false;">
        <img src="img/fr.png" class="logo">
      </a>
      <strong>FR Cabeleireiros · Painel de Colaborador</strong>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="tab-marcacoes">📅 Marcações</button>
      <button class="tab-btn" data-tab="tab-ferias">🏖️ Férias</button>
      <button class="tab-btn" data-tab="tab-pausas">☕ Pausas</button>
      <button class="tab-btn" data-tab="tab-conta">⚙️ A minha conta</button>
    </div>

    <button id="logout-btn">Sair</button>
  </div>
</header>

<div class="wrapper">

  <div id="bemvindo"></div>

  <!-- ABA: MARCAÇÕES -->
<section class="tab-content active" id="tab-marcacoes">
  <section class="card card-full">
    <h2>As minhas marcações</h2>

    <div class="list" id="lista-reservas">
      <div class="list-empty">Sem marcações.</div>
    </div>

    <button id="btn-historico" class="btn-secondary" style="margin-top:1rem;">
      📅 Ver histórico
    </button>

    <input type="month" id="historico-mes" class="input-modern" style="display:none; margin-top:0.7rem;">

    <h3 class="subtitle" style="margin-top:1.8rem;">Registar marcação manual (telefone)</h3>

    <label>Data</label>
    <input type="text" id="manual-data" class="input-modern" placeholder="Escolhe a data" />

    <label>Hora</label>
    <select id="manual-hora" class="input-modern">
      <option value="">Escolhe a data primeiro</option>
    </select>

    <label>Serviço</label>
    <select id="manual-servico" class="input-modern">
      <option value="corte e lavagem">Corte e Lavagem</option>
    </select>

    <label>Nome do cliente</label>
    <input type="text" id="manual-nome" class="input-modern" placeholder="Nome" />

    <label>Telemóvel do cliente</label>
    <input type="tel" id="manual-telemovel" class="input-modern" placeholder="9XXXXXXXX" />

    <button id="btn-add-manual" class="btn-primary">➕ Registar marcação</button>
  </section>
</section>

  <!-- ABA: FÉRIAS -->
  <section class="tab-content" id="tab-ferias">
    <section class="card card-full">
      <h2>Férias</h2>

      <div class="list" id="lista-ferias">
        <div class="list-empty">Sem férias registadas.</div>
      </div>

      <h3 class="subtitle">Adicionar férias</h3>

      <input type="date" id="ferias-inicio" class="input-modern" />
      <input type="date" id="ferias-fim" class="input-modern" />

      <button id="btn-add-ferias" class="btn-primary">➕ Guardar férias</button>
    </section>
  </section>

  <!-- ABA: PAUSAS -->
  <section class="tab-content" id="tab-pausas">
    <section class="card card-full">
      <h2>Pausas / Almoço</h2>

      <div class="list" id="lista-pausas">
        <div class="list-empty">Sem pausas registadas.</div>
      </div>

      <h3 class="subtitle">Adicionar pausa</h3>

      <label>Data início</label>
      <input type="date" id="pausa-data" class="input-modern" />

      <label>Data fim</label>
      <input type="date" id="pausa-data-fim" class="input-modern" />

      <label>Hora início</label>
      <input type="time" id="pausa-inicio" class="input-modern" />

      <label>Hora fim</label>
      <input type="time" id="pausa-fim" class="input-modern" />

      <button id="btn-add-pausa" class="btn-primary">➕ Guardar pausa</button>
    </section>
  </section>

  <!-- ABA: CONTA (por implementar na Fase 3) -->
  <section class="tab-content" id="tab-conta">
    <section class="card card-full">
      <h2>A minha conta</h2>
      <p class="list-empty">Em breve: alterar username e password.</p>
    </section>
  </section>

</div>

<!-- MODAL -->
<div id="modal-bg">
  <div id="modal">
    <h3 id="modal-title">Editar</h3>

    <input type="date" id="modal-data1" class="input-modern">
    <input type="date" id="modal-data2" class="input-modern">
    <input type="time" id="modal-hora1" class="input-modern">
    <input type="time" id="modal-hora2" class="input-modern">

    <button id="modal-save" class="btn-primary">💾 Guardar alterações</button>
    <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<!-- JS -->
<script type="module" src="js/staff.js"></script>

<!-- NAVEGAÇÃO ENTRE ABAS -->
<script>
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });
</script>

</body>
</html>
