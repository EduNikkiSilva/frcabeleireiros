<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Painel Staff - FR Cabeleireiros</title>
  <link rel="icon" type="image/png" href="img/fr.ico">

  <!-- CSS -->
  <link rel="stylesheet" href="css/dashboard.css">

  <!-- Nhost -->
  <script type="module" src="js/nhost.js"></script>
</head>

<body>

<header>
  <div class="logo-area">
    <a href="#" onclick="location.reload(); return false;">
      <img src="img/fr.png" class="logo">
    </a>
    <strong>FR Cabeleireiros · Painel de Colaborador</strong>
  </div>
  <button id="logout-btn">Sair</button>
</header>

<div class="wrapper">

  <div id="bemvindo"></div>

  <div class="cards-grid">

    <!-- CARD 1: MARCAÇÕES -->
    <section class="card">
      <h2>As minhas marcações</h2>

      <div class="list" id="lista-reservas">
        <div class="list-empty">Sem marcações.</div>
      </div>
      
      <button id="btn-historico" class="btn-secondary" style="margin-top:1rem;">
        📅 Ver histórico
      </button>
      
      <input type="month" id="historico-mes" class="input-modern" style="display:none; margin-top:0.7rem;">
    </section>

    <!-- CARD 2: FÉRIAS -->
    <section class="card">
      <h2>Férias</h2>

      <div class="list" id="lista-ferias">
        <div class="list-empty">Sem férias registadas.</div>
      </div>

      <h3 class="subtitle">Adicionar férias</h3>

      <input type="date" id="ferias-inicio" class="input-modern" />
      <input type="date" id="ferias-fim" class="input-modern" />

      <button id="btn-add-ferias" class="btn-primary">➕ Guardar férias</button>
    </section>

    <!-- CARD 3: PAUSAS -->
    <section class="card">
      <h2>Pausas / Almoço</h2>

      <div class="list" id="lista-pausas">
        <div class="list-empty">Sem pausas registadas.</div>
      </div>

      <h3 class="subtitle">Adicionar pausa</h3>

      <label>Data início</label>
      <input type="date" id="pausa-data" class="input-modern" />

      <label>Data fim</label>
      <input type="date" id="pausa-data-fim" class="input-modern" />

      <label>Hora início</label>
      <input type="time" id="pausa-inicio" class="input-modern" />

      <label>Hora fim</label>
      <input type="time" id="pausa-fim" class="input-modern" />

      <button id="btn-add-pausa" class="btn-primary">➕ Guardar pausa</button>
    </section>

  </div>
</div>

<!-- MODAL -->
<div id="modal-bg">
  <div id="modal">
    <h3 id="modal-title">Editar</h3>

    <input type="date" id="modal-data1" class="input-modern">
    <input type="date" id="modal-data2" class="input-modern">
    <input type="time" id="modal-hora1" class="input-modern">
    <input type="time" id="modal-hora2" class="input-modern">

    <button id="modal-save" class="btn-primary">💾 Guardar alterações</button>
    <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<!-- JS -->
<script type="module" src="js/staff.js"></script>

</body>
</html>
