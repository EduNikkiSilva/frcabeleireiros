<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>FR Cabeleireiros</title>
  <link rel="icon" type="image/png" href="img/fr.ico">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1s ease forwards;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      margin-bottom: 20px;
    }

    .loading {
      margin-top: 10px;
      font-size: 1rem;
      color: #6b7280;
      animation: blink 1.2s infinite;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }
  </style>

  <script>
    // Redireciona para main.html após animação
    setTimeout(() => {
      window.location.href = "main.html";
    }, 1500);
  </script>

  <!-- Vercel Speed Insights -->
  <script type="module">
    import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1.0.14/dist/index.mjs';
    injectSpeedInsights();
  </script>
</head>

<body>
  <div class="container">
    <img src="img/fr.png" class="logo" alt="FR Cabeleireiros">
    <div class="loading">A carregar...</div>
  </div>
  
</body>
</html>
